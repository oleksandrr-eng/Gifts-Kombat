<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Gift Tapper</title>
<style>
/* TikTok-like look: black, white bold type, cyan + red two-tone accents */
:root{
  --bg:#000; --card:#161823; --card2:#1f2130; --line:rgba(255,255,255,.12);
  --text:#fff; --muted:rgba(255,255,255,.55); --cyan:#25f4ee; --red:#fe2c55;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports (height:100dvh){html{height:100dvh}}
body{background:var(--bg);color:var(--text);font:15px/1.3 "Proxima Nova",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.coin{display:inline-block;flex:none;width:1em;height:1em;vertical-align:-.15em}
.coin img{width:100%;height:100%;object-fit:contain}
.glitch{text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}

.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:14px var(--gr) 16px var(--gl);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* Top: player */
.profile{position:relative;display:grid;gap:12px;padding:16px;border-radius:12px;background:var(--card)}
.p-head{display:flex;align-items:center;gap:14px;min-width:0}
.avatar{position:relative;flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;
  background:linear-gradient(140deg,#ffb38a,#ff5d7a 55%,#7b4dff);box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--red)}
.avatar .live{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);padding:2px 7px;border-radius:4px;background:var(--red);
  font-weight:800;font-size:10px;letter-spacing:.06em;box-shadow:0 0 0 2px var(--card)}
.p-name{min-width:0;flex:1}
.p-name b{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-name span{display:block;font-size:14px;color:var(--muted)}
.p-name .lvl{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 9px;border-radius:99px;background:rgba(254,44,85,.16);
  color:#ff6b88;font-size:12px;font-weight:700}
.restart{flex:none;align-self:flex-start;width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.restart svg{width:18px;height:18px}
.restart:active{transform:scale(.92)}
.counts{padding-top:6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.counts div + div{border-left:1px solid var(--line)}
.counts b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.counts span{font-size:13px;color:var(--muted)}

/* Balance and level */
.balance{display:flex;align-items:center;justify-content:center;gap:10px;font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.balance .coin{width:42px;height:42px}
.level{display:grid;gap:7px}
.level-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.level-row b{font-size:16px;font-weight:800}
.level-row span{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;transition:width .25s;background:linear-gradient(90deg,var(--cyan),var(--red))}

/* The big tap button: black disc with the cyan / red split glow */
.arena{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.orb{position:relative;width:min(76vw,330px,100%);aspect-ratio:1;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 50% 40%,#1d1f2b,#0b0b10 72%);
  box-shadow:-7px -4px 0 0 var(--cyan),7px 4px 0 0 var(--red),-14px -8px 40px rgba(37,244,238,.35),14px 8px 40px rgba(254,44,85,.4);
  transition:transform .08s ease-out}
@supports not (aspect-ratio:1/1){.orb{height:min(76vw,330px)}}
.gift{position:absolute;inset:13%;display:grid;place-items:center;pointer-events:none}
.gift img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.gift.evolve{animation:evolve .7s cubic-bezier(.2,.9,.3,1.3)}
.flash{position:absolute;inset:0;border-radius:50%;background:radial-gradient(#fff,transparent 65%);opacity:0;pointer-events:none}
.flash.on{animation:flash .7s ease-out}
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
.num{position:absolute;font-size:30px;font-weight:900;color:#fff;text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red);transform:translate(-50%,-50%);animation:num 1s ease-out forwards}
.spark{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;animation:spark .7s ease-out forwards}
.spark img{width:100%;height:100%}
.unlock{position:absolute;left:50%;top:6%;z-index:6;transform:translateX(-50%);padding:10px 18px;border-radius:999px;white-space:nowrap;
  background:var(--red);color:#fff;font-weight:800;font-size:16px;box-shadow:-3px 0 0 var(--cyan),0 10px 30px rgba(0,0,0,.5);animation:unlock 2.2s ease-out forwards}

/* Transfer button */
.transfer{width:100%;height:54px;border-radius:6px;background:var(--red);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:-3px 0 0 var(--cyan);transition:transform .1s}
.transfer:active{transform:scale(.98)}
.transfer:disabled{background:var(--card2);color:var(--muted);box-shadow:none;cursor:default}
.transfer .coin{width:22px;height:22px}

/* Full-screen result screens */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding:24px var(--gr) 24px var(--gl);background:rgba(0,0,0,.94);animation:fade .25s}
.screen h2{margin:0;font-size:30px;font-weight:900;line-height:1.15;text-wrap:balance}
.screen p{margin:0;font-size:16px;color:var(--muted);max-width:320px}
.screen p b{color:#fff}
.screen .pic{position:relative;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,#1d1f2b,#0b0b10 72%);box-shadow:-6px -3px 0 var(--cyan),6px 3px 0 var(--red)}
.screen .pic img{position:absolute;inset:14%;width:72%;height:72%;object-fit:contain}
.screen .amount{display:flex;align-items:center;gap:10px;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.screen .amount .coin{width:40px;height:40px}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid rgba(255,255,255,.12);border-top-color:var(--red);border-left-color:var(--cyan);animation:spin .8s linear infinite}
.progress{width:min(280px,100%);height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--red));animation:load 1.8s ease-in-out forwards}
.actions{display:grid;gap:10px;width:min(320px,100%);margin-top:8px}
.actions button{height:50px;border-radius:6px;font-size:17px;font-weight:800}
.primary{background:var(--red);box-shadow:-3px 0 0 var(--cyan)}
.secondary{background:var(--card2);border:1px solid var(--line)}
.prank-text{font-size:34px;font-weight:900;line-height:1.15;text-transform:uppercase;text-wrap:balance;text-shadow:-3px -1px 0 var(--cyan),3px 1px 0 var(--red)}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
.toast{position:absolute;left:50%;bottom:90px;z-index:9;padding:10px 16px;border-radius:8px;background:rgba(84,84,84,.92);
  font-weight:600;white-space:nowrap;opacity:0;transform:translate(-50%,8px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes load{to{width:100%}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes num{0%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-90px}}
@keyframes spark{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
@keyframes evolve{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(6deg);opacity:1}100%{transform:none}}
@keyframes flash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
@keyframes unlock{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="profile">
    <div class="p-head">
      <div class="avatar"><span id="initials"></span><span class="live">LIVE</span></div>
      <div class="p-name">
        <b id="playerName"></b>
        <span id="handle"></span>
        <span class="lvl" id="levelName"></span>
      </div>
      <button class="restart" id="reset" type="button" aria-label="Start again from the first gift"></button>
    </div>
    <div class="counts">
      <div><b id="following"></b><span>Following</span></div>
      <div><b id="followers"></b><span>Followers</span></div>
      <div><b id="likes"></b><span>Likes</span></div>
    </div>
  </section>

  <div class="balance"><span class="coin" data-coin></span><span class="glitch" id="balance">0</span></div>

  <div class="level">
    <div class="level-row"><b id="giftName"></b><span id="levelText"></span></div>
    <div class="bar"><i id="levelBar"></i></div>
  </div>

  <div class="arena">
    <button class="orb" id="orb" type="button" aria-label="Tap">
      <span class="gift" id="gift"></span>
      <span class="flash" id="flash"></span>
    </button>
    <div class="fx" id="fx"></div>
  </div>

  <button class="transfer" id="transfer" type="button"><span class="coin" data-coin></span><span>Transfer coins to account</span></button>

  <!-- 1. transferring -->
  <div class="screen" id="sending" hidden>
    <div class="spinner"></div>
    <h2>Transferring coins…</h2>
    <p>Sending <b id="sendAmount"></b> coins to <b id="sendTo"></b></p>
    <div class="progress"><i></i></div>
  </div>
  <!-- 2. congratulations -->
  <div class="screen" id="done" hidden>
    <div class="pic" id="donePic"></div>
    <h2>Congratulations! 🎉</h2>
    <div class="amount"><span class="coin" data-coin></span><span id="doneAmount"></span></div>
    <p>coins were transferred to <b id="doneTo"></b></p>
    <div class="actions">
      <button class="primary" id="again1" type="button">Play again</button>
      <button class="secondary" id="learn" type="button">Learn more</button>
    </div>
  </div>
  <!-- 3. prank reveal -->
  <div class="screen" id="prank" hidden>
    <div class="prank-text" id="prankText"></div>
    <p id="prankNote"></p>
    <div class="actions"><button class="primary" id="again2" type="button">Play again</button></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* ============================ SETTINGS ============================ */
var CONFIG = {
  playerName: 'Mia',
  playerInitials: 'MV',
  account: '@mia.vibes',     // handle shown under the name and on the transfer screens
  // Following, Followers and Likes all start at 0 and grow with every tap
  prankText: 'Это пранк, и всё это нереально',
  prankNote: 'The coins are not real. Thanks for playing!',
  saveProgress: true,       // remember balance on this device
  // gift ladder, cheapest first: [name, coins needed to reach it, coins per tap, picture]
  // picture empty = the built-in one with that name
  levels: [
    ['Rose',              0,      10],
    ['Monster Eye',       80,     25],
    ['Finger Heart',      280,    50],
    ['Pumpkin Pie',       680,    100],
    ['Candy Pumpkin',     1480,   200],
    ['Accordion',         3080,   400],
    ['Corgi',             6280,   750],
    ['Autumn Tree',       12280,  1500],
    ['Rainbow Dolphin',   24280,  3000],
    ['Lion',              48280,  6000],
    ['Lion Pride',        96280,  12000],
    ['Pegasus',           192280, 25000]
  ]
};
/* ================================================================== */

document.addEventListener('DOMContentLoaded', function () {
  var MEDIA = window.MEDIA || {};

  function $(id) { return document.getElementById(id); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function short(n) {
    return n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(Math.floor(n));
  }
  function num(n) { return Math.floor(n).toLocaleString('en-US'); }
  function img(src, alt) { return src ? '<img src="' + src + '" alt="' + (alt || '') + '" draggable="false">' : '🎁'; }
  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  var toastTimer;
  function toast(t) {
    $('toast').textContent = t; $('toast').classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $('toast').classList.remove('on'); }, 1800);
  }

  var COIN = img(MEDIA.coin) === '🎁' ? '🪙' : img(MEDIA.coin);
  document.querySelectorAll('[data-coin]').forEach(function (el) { el.innerHTML = COIN; });
  var LEVELS = CONFIG.levels.map(function (l) {
    return { name: l[0], need: l[1], perTap: l[2], pic: l[3] || (l[0] === 'Rose' ? MEDIA.rose : (MEDIA.gifts || {})[l[0]]) };
  });
  $('playerName').textContent = CONFIG.playerName;
  $('handle').textContent = CONFIG.account;
  $('initials').textContent = CONFIG.playerInitials;

  /* ---------- State (saved on this device) ---------- */
  var state = { coins: 0, likes: 0, followers: 0, following: 0, t: Date.now() };
  try {
    var saved = CONFIG.saveProgress && JSON.parse(localStorage.getItem('giftTapper') || 'null');
    if (saved && saved.coins >= 0) { state = saved; ['likes', 'followers', 'following'].forEach(function (k) { state[k] = state[k] || 0; }); }
  } catch (e) {}
  function save() {
    state.t = Date.now();
    try { if (CONFIG.saveProgress) localStorage.setItem('giftTapper', JSON.stringify(state)); } catch (e) {}
  }
  function levelOf(c) { var i = 0; while (i + 1 < LEVELS.length && c >= LEVELS[i + 1].need) i++; return i; }
  var level = levelOf(state.coins);

  /* ---------- Drawing ---------- */
  function showGift(animate) {
    var L = LEVELS[level];
    $('gift').innerHTML = img(L.pic, L.name);
    if (animate) { replay($('gift'), 'evolve'); replay($('flash'), 'on'); }
  }
  function render() {
    var L = LEVELS[level], next = LEVELS[level + 1];
    $('balance').textContent = num(state.coins);
    $('giftName').textContent = L.name;
    $('levelName').textContent = '★ Level ' + (level + 1) + ' · ' + L.name;
    $('likes').textContent = short(state.likes);
    $('followers').textContent = short(state.followers);
    $('following').textContent = short(state.following);
    $('levelText').textContent = (level + 1) + ' / ' + LEVELS.length;
    $('levelBar').style.width = (next ? Math.min(100, (state.coins - L.need) / (next.need - L.need) * 100) : 100) + '%';
    $('transfer').disabled = state.coins <= 0;
  }

  /* ---------- Tapping ---------- */
  var orb = $('orb'), fx = $('fx');
  function tapAt(clientX, clientY) {
    var L = LEVELS[level];
    state.coins += L.perTap;
    state.likes++;
    state.followers += Math.ceil(rand(0, 2 + level * 3));      // more followers as the gift gets pricier
    if (Math.random() < .25) state.following++;

    // tilt toward the finger
    var r = orb.getBoundingClientRect(), dx = (clientX - r.left) / r.width - .5, dy = (clientY - r.top) / r.height - .5;
    orb.style.transform = 'perspective(600px) rotateX(' + (-dy * 18) + 'deg) rotateY(' + (dx * 18) + 'deg) scale(.96)';
    clearTimeout(orb._t); orb._t = setTimeout(function () { orb.style.transform = ''; }, 90);

    // "+N" and coin sparks at the finger
    var a = fx.getBoundingClientRect(), x = clientX - a.left, y = clientY - a.top;
    var n = document.createElement('div');
    n.className = 'num'; n.textContent = '+' + num(L.perTap); n.style.left = x + 'px'; n.style.top = y + 'px';
    n.addEventListener('animationend', function () { n.remove(); });
    fx.appendChild(n);
    for (var i = 0; i < 3 + Math.min(5, level); i++) {
      var s = document.createElement('div');
      s.className = 'spark'; s.innerHTML = COIN; s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--x', rand(-60, 60) + 'px'); s.style.setProperty('--y', rand(-80, 10) + 'px');
      s.addEventListener('animationend', function () { this.remove(); });
      fx.appendChild(s);
    }
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}

    // the gift turns into a more expensive one
    var now = levelOf(state.coins);
    if (now > level) {
      level = now;
      showGift(true);
      var old = fx.querySelector('.unlock'); if (old) old.remove();
      var u = document.createElement('div');
      u.className = 'unlock'; u.textContent = '🎉 New gift: ' + LEVELS[level].name + '!';
      u.addEventListener('animationend', function () { u.remove(); });
      fx.appendChild(u);
      try { if (navigator.vibrate) navigator.vibrate([20, 40, 20]); } catch (e) {}
    }
    render();
  }
  // every finger counts (multi-touch), mouse works too
  if (window.PointerEvent) {
    orb.addEventListener('pointerdown', function (e) { e.preventDefault(); tapAt(e.clientX, e.clientY); });
  } else {
    orb.addEventListener('touchstart', function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) tapAt(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
    });
    orb.addEventListener('mousedown', function (e) { tapAt(e.clientX, e.clientY); });
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- Restart from the first gift ---------- */
  function restart() {
    state = { coins: 0, likes: 0, followers: 0, following: 0, t: Date.now() };
    level = 0;
    fx.innerHTML = '';
    ['sending', 'done', 'prank'].forEach(function (id) { $(id).hidden = true; });
    showGift(true);
    render(); save();
  }
  $('reset').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>';
  $('reset').addEventListener('click', function () { restart(); toast('Back to the first gift'); });

  /* ---------- Transfer -> congratulations -> prank ---------- */
  $('prankText').textContent = CONFIG.prankText;
  $('prankNote').textContent = CONFIG.prankNote;
  function confetti() {
    var box = $('done'), colors = ['#25f4ee', '#fe2c55', '#fff', '#ffc83d'];
    for (var i = 0; i < 40; i++) {
      var c = document.createElement('i');
      c.className = 'confetti';
      c.style.left = rand(0, 100) + '%';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = rand(1.6, 3) + 's';
      c.style.animationDelay = rand(0, .6) + 's';
      c.addEventListener('animationend', function () { this.remove(); });
      box.appendChild(c);
    }
  }
  $('transfer').addEventListener('click', function () {
    if (state.coins <= 0) return;
    var amount = num(state.coins);
    $('sendAmount').textContent = amount; $('sendTo').textContent = CONFIG.account;
    $('doneAmount').textContent = amount; $('doneTo').textContent = CONFIG.account;
    $('donePic').innerHTML = img(LEVELS[level].pic, LEVELS[level].name);
    var bar = $('sending').querySelector('.progress i');
    bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
    $('sending').hidden = false;
    setTimeout(function () {
      $('sending').hidden = true;
      $('done').hidden = false;
      confetti();
      try { if (navigator.vibrate) navigator.vibrate([30, 50, 30]); } catch (e) {}
    }, 1900);
  });
  $('again1').addEventListener('click', restart);
  $('again2').addEventListener('click', restart);
  $('learn').addEventListener('click', function () { $('done').hidden = true; $('prank').hidden = false; });

  /* ---------- Autosave ---------- */
  setInterval(save, 2000);
  window.addEventListener('pagehide', save);

  // keep the gift circle inside the space left between the header and the button
  function fitOrb() {
    var a = orb.parentNode, size = Math.min(a.clientWidth * .86, a.clientHeight * .9, 340);
    orb.style.width = orb.style.height = Math.max(120, size) + 'px';
  }
  window.addEventListener('resize', fitOrb);
  fitOrb();

  showGift(false);
  render();
});
</script>

<!-- Built-in pictures. Leave as is, or set a picture per level in CONFIG.levels. -->
